<!DOCTYPE html>
<html lang="id">
<head>

<title>RSUD H. Abdul Manap — Portal Internal</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0f172a,#1e3a5f);color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

  a.card{display:block;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:22px 18px;text-decoration:none;color:#e2e8f0;transition:.15s}

  .card b{display:block;font-size:1rem;margin-bottom:4px}
  .card span{color:#94a3b8;font-size:.8rem}
  .foot{margin-top:26px;color:#64748b;font-size:.72rem}

</head>

    </a>
    <a class="card" href="/projek-3/">
      <div class="ico">📂</div>
